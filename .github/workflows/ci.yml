name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Validate package
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Test
        run: composer test

      - name: Release notes for the current version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ \* Version:[[:space:]]*//p' gcal-to-wpem.php | tr -d '\r')
          bash bin/release-notes.sh "$version" gcal-to-wpem.php "$RUNNER_TEMP/release-notes.md"
