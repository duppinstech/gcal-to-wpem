name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Verify tag matches plugin version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^ \* Version:[[:space:]]*//p' gcal-to-wpem.php | tr -d '\r')
          constant=$(sed -n "s/^define('GCAL_WPEM_VERSION', '\(.*\)');/\1/p" gcal-to-wpem.php | tr -d '\r')
          stable=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | tr -d '\r')
          echo "tag=$tag header=$header constant=$constant stable=$stable"
          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ] || [ "$tag" != "$stable" ]; then
            echo "::error::Tag v$tag does not match plugin header / GCAL_WPEM_VERSION / readme Stable tag."
            exit 1
          fi

      - name: Install dependencies and test
        run: |
          composer install --no-interaction --prefer-dist
          composer test

      - name: Write release notes
        run: bash bin/release-notes.sh "${GITHUB_REF_NAME#v}" gcal-to-wpem.php release-notes.md

      - name: Build plugin zip
        run: bash bin/build-zip.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" gcal-to-wpem.zip --title "${{ github.ref_name }}" --notes-file release-notes.md
